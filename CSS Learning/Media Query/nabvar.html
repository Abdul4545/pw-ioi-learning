<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <style>
        /* Default Navigation Styles */
      .navbar {
        background-color: black;
        padding: 15px;
        text-align: center;
      }

      .nav-links {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .nav-links li {
        display: inline-block;
        margin: 0 15px;
      }

      .nav-links a {
        text-decoration: none;
        color: white;
        font-size: 18px;
      }

      /* Mobile View - Hide Menu and Show as a Block */
      @media screen and (max-width: 768px) {
        .navbar {
            background-color: rgb(96, 95, 95);
        }
        .nav-links {
          display: block;
          text-align: center;
        }

        .nav-links li {
          display: block;
          margin: 10px 0;
        }
      }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
</body>
</html>
