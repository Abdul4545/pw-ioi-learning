<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Position</title>
    <style>
        /*
            position: fixed; keeps an element fixed in place relative to the viewport, regardless of scrolling.
        */
        * {
            margin: 0;
            padding: 0;
        }
        .box-1 {
            width: 100vw;
            height: 100px;
            background-color: black;
            position: fixed;
        }

        .box-2 {
            width: 100vw;;
            height: 1000px;
            background-color: aquamarine;
        }
        .box-3 {
            width: 100vw;;
            height: 1000px;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>
</body>
</html>
