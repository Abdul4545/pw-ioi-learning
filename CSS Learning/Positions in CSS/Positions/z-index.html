<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        /*
            The z-index property controls the stacking order of elements. It only works on positioned elements (relative, absolute, fixed, or sticky).
        */
        .box1, .box2 {
            width: 100px;
            height: 100px;
            position: absolute;
        }
        
        .box1 {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 2;
        }
        
        .box2 {
            background-color: blue;
            top: 70px;
            left: 70px;
            z-index: 1;
        }

        /*
            Box 1 appears on top of Box 2 because of z-index: 2.
        */
        
    </style>
</head>
<body>
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
</body>
</html>
