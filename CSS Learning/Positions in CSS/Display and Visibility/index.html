<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display and Visibility</title>

    <style>
      /* 
            The display property in CSS defines how an element is rendered on the page. Different values determine whether an element behaves as a block, inline, or inline-block element, among others.
        */

      /*
            Block (display: block) : Elements with display: block take up the full width available, pushing other elements to a new line. They respect width and height properties.
            Common block-level elements:
            <div>, <p>, <h1> to <h6>, <section>, <article>, <header>, <footer>
        */

      .block-div {
        display: block;
        width: 200px;
        height: 100px;
        background-color: lightblue;
      }

      /*
            Inline (display: inline) : Inline elements do not start on a new line; they flow with text. They do not respect width and height settings. 
            Common inline elements:
            <span>, <a>, <strong>, <em>, <b>, <i>
      */

        .myspan {
            display: inline;
            color: red;
            width: 600px;
            height: 200px;
            padding: 40px;
            background-color: azure;
        }

        /*
            Inline-Block (display: inline-block): Like inline, it does not start on a new line. Like block, it respects width and height. Useful for making elements behave like inline elements while still allowing size control.
        */

        .inline-block {
            display: inline-block;
            color: red;
            width: 200px;
            height: 50px;
            background-color: azure;
        }

        /*
            None (display: none): Removes the element from the document flow completely. The element does not take up space. Often used to hide elements dynamically via JavaScript.
        */
        .removed {
            display: none;
        }

        /*
            Visibility Properties
            The visibility property controls whether an element is visible without affecting its layout.

            1. Visible (visibility: visible)
            The default value.
            The element is displayed normally.

            2. Hidden (visibility: hidden)
            Hides the element but keeps its space reserved.
            Unlike display: none, the element remains in the layout.
        */

        .hide {
            width: 200px;
            height: 200px;
            visibility: hidden;
        }

        /*

            Differences Between display: none, visibility: hidden, and opacity: 0
            Property	        Removes element from document flow?	    Takes up space?	    Can be interacted with?
            display: none	    ✅ Yes	                               ❌ No	             ❌ No
            visibility: hidden	❌ No	                               ✅ Yes	         ❌ No
            opacity: 0	        ❌ No	                               ✅ Yes	         ✅ Yes (Still clickable)
        */

        .opacity-50 {
            opacity: 0.5;
        }
        .opacity {
            opacity: 0;
        }
    
    </style>
  </head>
  <body>
    <div class="block-div"></div>
    <span class="myspan">hello world from span tag</span>
    <span class="inline-block">hello world again from span tag</span>
    <div class="removed">I am hidden</div>
    <h1>hello</h1>
    <div class="hide"></div>
    <h2>hello world</h2>
    <h1 class="opacity-50">50% Opacity is applied on me</h1>
    <h2 class="opacity">I am hidden using opacity</h2>
    <h3>I am after 100% opacity element</h3>
  </body>
</html>
