<!DOCTYPE html> 
<!-- to tell browser it is HTML5 DOCUMENT -->

<html lang="en">
<!-- The lang attribute specifies the language of the element's content -->

<head>
    <meta charset="UTF-8">
    <!-- an HTML tag that makes it possible to use emojis and other characters that aren't in the traditional ASCII character set on your webpage. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- name="viewport" - tells the browser that the meta tag is related to the viewport settings, which control how the webpage is displayed on different screen sizes and devices. -->
    
    <!-- width="device-width" - This sets the viewport width to match the screen width of the device -->

    <!-- initial-scale=1.0 - This sets the initial zoom level of the webpage when it first loads. -->

    <title>Hello World</title>
</head>
<body>
    Hello World
</body>
</html>
