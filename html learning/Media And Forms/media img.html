<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and its Attributes</title>
</head>
<body>
    
    <img src="/html learning/image-1.jpg" alt="nature image">
    
    <!-- The <img> tag is used to embed an image in an HTML page. The image tag is a self closing tag. -->
    <!-- src - Specifies the path to the image -->
    <!-- alt - Specifies an alternate text for the image, if the image for some reason cannot be displayed-->

    <!-- 
        Below are attributes which are not mandatory :

        width:"100px" - Specifies the width of an image
        height:"100px" - Specifies the height of an image
        It is recommended to use either width or height to maintain the aspect ratio of the image

        loading="lazy" - The loading attribute specifies whether a browser should load an image immediately or to defer loading until the user scrolls near them. be default its value is "eager"

    -->
</body>
</html>
