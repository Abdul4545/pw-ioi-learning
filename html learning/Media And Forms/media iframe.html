<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame</title>
</head>
<body>
    <!-- An iFrame (Inline Frame) is an HTML element that allows embedding another HTML document within the current page. It is commonly used to display videos, maps, advertisements, and other web pages inside a web page. -->

    <iframe src="https://flipkart.com" width="500px" height="500px"></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/NFCDFKQ3nD0?si=cQX9GwIWz_vwrZmy" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe src="https://maps.google.com/maps?q=New+York&output=embed" width="600" height="400"></iframe>



    <!-- 
        Attribute	        Description
        src	                Specifies the URL of the page to be embedded.
        width	            Defines the width of the iFrame (in pixels or percentage).
        height	            Defines the height of the iFrame.
        name	            Assigns a name to the iFrame (used for targeting by scripts or links).
        frameborder	        Defines whether the iFrame has a border (0 = no border, 1 = border).
        allowfullscreen	    Allows the embedded content to be viewed in full-screen mode. 
    -->

    
</body>
</html>
