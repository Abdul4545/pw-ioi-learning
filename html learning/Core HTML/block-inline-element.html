<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and inline elements</title>
</head>
<body>
    <!-- Block-level Elements : A block-level element always starts on a new line, and the browsers automatically add some space (a margin) before and after the element. A block-level element always takes up the full width available -->
    <p>Hello World, I am block element.</p>
    <div>Hello World, I am block element.</div>

    <!-- Other examples of block level elements:
        <div> – A generic container
        <p> – Paragraph
        <h1> to <h6> – Headings
        <ul> – Unordered list
        <ol> – Ordered list
        <li> – List item
        <table> – Table
        <nav> - used to define a section of navigation links in a webpage.
        <section> – Section of a document
        <article> – Independent content block
        <header> – Header of a section
        <footer> – Footer of a section
        etc.
    -->

    <!-- Inline Elements : An inline element does not start on a new line. An inline element only takes up as much width as necessary.-->
    <span>Hello World</span>
    x<sup>2</sup> = 25
    <!-- The above two are the examples of inline elements.-->

    <!-- Other examples of inline elements:
        <span> – A generic inline container
        <a> – Anchor (link)
        <strong> – Bold text
        <em> – Italicized text
        <b> – Bold text (without semantic meaning)
        <i> – Italic text (without semantic meaning)
        <img> – Image
        <br> – Line break
        <input> – Input field
        <label> – Label for a form element
        <code> – Inline code formatting
        etc.
    -->


    
</body>
</html>
