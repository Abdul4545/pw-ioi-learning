<!DOCTYPE html>
<html lang="en">
<!-- The lang Attribute : You should always include the lang attribute inside the <html> tag, to declare the language of the Web page. This is meant to assist search engines and browsers. -->    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All about attributes</title>
</head>
<body>
    <!--HTML attributes provide additional information about HTML elements. All HTML elements can have attributes. Attributes provide additional information about elements. Attributes are always specified in the start tag.Attributes usually come in name/value pairs like: name="value" -->


    <!-- The style Attribute: The style attribute is used to add styles to an element, such as color, font, size, and more. -->
    <p style="color:red;">This is an example of style attribute</p>


    <!-- The src Attribute : The <img> tag is used to embed an image in an HTML page. The src attribute specifies the path to the image to be displayed. -->
    <img src="../image-1.jpg">


    <!-- With the passage of time we will learn a lot other attributes. These are the fex examples of attributes -->

</body>
</html>
