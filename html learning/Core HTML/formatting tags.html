<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Tags</title>
</head>
<body>
    <!-- b, strong, i, em, mark, small, del, ins, sub, sup, s, big -->

    <p><b>I am Bold</b></p>  
    <!-- The <b> tag makes text bold without adding extra emphasis or importance. -->

    <p><strong>I am Stong</strong></p>  
    <!--The <strong> tag indicates important text and typically renders as bold. It conveys semantic importance, meaning that screen readers will emphasize it.-->

    <p><i>I am i</i></p>
    <!-- The <i> tag is used to display italicized text without adding emphasis. It is often used for terms, technical phrases, or foreign words. -->

    <p>This is <em>important</em> information.</p>
    <!-- The <em> tag is used for emphasized text. Similar to <i>, but conveys meaningful emphasis, which screen readers recognize. -->

    <p><mark>I am mark</mark></p>
    <!-- The <mark> tag highlights text with a default yellow background. Useful for marking search results or important sections -->

    <p><small>I am small</small></p>
    <!-- The <small> tag reduces the font size. Used for legal disclaimers, copyright notices -->

    <p><del>I am delete</del></p>
    <!-- The <del> tag represents deleted text. Useful for showing edits or indicating removed content. -->

    <p>This is <ins>newly added</ins> text.</p>
    <!-- The <ins> tag is used to indicate inserted text. Usually underlined by default. -->

    <p>log<sub>10</sub></p>
    <!-- The <sub> tag makes text subscript, moving it below the baseline. Commonly used in chemical formulas and mathematical equations. -->

    <p>2<sup>2</sup> = 4</p>
    <!-- The <sup> tag makes text superscript, moving it above the baseline. used in mathematical exponents or ordinal indicators. -->

    <p>The price was <s>$50</s> now $30!</p>
    <!-- The <s> tag displays strikethrough text without semantic meaning. Used for indicating outdated or irrelevant information. -->

    <p>lorem <big>depreciated in HTML 5</big></p>
    <!--The <big> tag increased text size, but it is deprecated in HTML5. Instead, use CSS (font-size: larger;). -->
    
</body>
</html>
