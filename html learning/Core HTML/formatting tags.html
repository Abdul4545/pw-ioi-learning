<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting Tags</title>
</head>
<body>
    <!-- b, strong, i, em, mark, small, del, ins, sub, sup, s, big -->
    <p><b>I am Bold</b></p>
    <p><strong>I am Stong</strong></p>
    <p><i>I am i</i></p>
    <p><em>I am em</em></p>
    <p><mark>I am mark</mark></p>
    <p><small>I am small</small></p>
    <p><del>I am delete</del></p>
    <p><ins>I am ins</ins></p>
    <p>log<sub>10</sub></p>
    <p>2<sup>2</sup> = 4</p>
    <p>lorem <s>Lorem, ipsum.</s></p>
    <p>lorem <big>depreciated in HTML 5</big></p>
    
</body>
</html>
